const F={
silben:{1:[['Was machst du beim Schwingen?','Ich spreche das Wort deutlich in Silben und zeichne Silbenbögen.','Ich bilde den Plural.','Ich suche ein verwandtes Wort mit a.','Schwingen heißt: langsam in Silben sprechen, zu jeder Silbe ein Bogen.'],['Was steckt in jeder Silbe?','ein Vokal, Umlaut oder Doppellaut','immer genau drei Buchstaben','ein doppelter Konsonant','Jede Silbe hat einen klingenden Kern: Vokal, Umlaut oder Doppellaut.'],['Wann sprichst du beim Schwingen leise mit?','vor, beim und nach dem Schreiben','nur vor dem Schreiben','nur bei kurzen Wörtern','Vorher in Silben sprechen, beim Schreiben mitsprechen, danach mit Silbenbögen prüfen.']],
3:[['Lena schreibt „Schoklade“. Wie findet sie ihren Fehler selbst?','Sie schwingt: Scho-ko-la-de. Dabei merkt sie, dass eine Silbe fehlt.','Sie bildet den Plural.','Sie sucht ein verwandtes Wort mit a.','Beim Schwingen spricht man jede Silbe mit. So fällt eine fehlende Silbe auf.']]},
verl:{1:[['Welche Buchstaben kann man am Wortende leicht verwechseln?','b/p, d/t und g/k','a/e, i/o und u/ü','m/n, l/r und s/z','Am Wortende klingt b wie p, d wie t und g wie k.'],['Wie verlängerst du ein Nomen?','Ich bilde den Plural.','Ich steigere es.','Ich bilde den Infinitiv.','Nomen → Plural: das Kalb → die Kälber.'],['Wie verlängerst du ein Adjektiv?','Ich steigere es.','Ich bilde den Plural.','Ich zerlege es.','Adjektiv steigern: wild → wilder.'],['Wie verlängerst du eine Verbform wie „sie singt“?','Ich bilde den Infinitiv.','Ich bilde den Plural.','Ich steigere sie.','Verb → Infinitiv: sie singt → singen.']],
3:[['Das Rad oder der Rat? Welche Aussage stimmt?','Das Fahrrad schreibt man mit d (Räder), den guten Rat mit t (raten).','Beide schreibt man mit d.','Beide schreibt man mit t.','Verlängern zeigt den Unterschied: Rä-der, aber ra-ten.'],['Bei welchem Wort hilft das Verlängern NICHT?','und','Hund','Mund','Kleine Wörter wie „und“ kann man nicht verlängern. Das sind Merkwörter.']]},
zerl:{1:[['Was machst du bei einem zusammengesetzten Wort mit einer schwierigen Stelle in der Mitte?','Erst zerlegen, dann verlängern.','Nur schwingen.','Ein verwandtes Wort mit a suchen.','Hand|buch → die Hände. So hörst du das d.'],['Wie prüfst du „freundlich“?','Den Wortbaustein -lich abtrennen und verlängern: Freunde.','Den Plural von „freundlich“ bilden.','Gar nicht, es ist ein Merkwort.','freund|lich → die Freun-de.']],
3:[['In „Bergwand“ gibt es zwei schwierige Stellen. Welche Beweiswörter brauchst du?','Berge und Wände','„Bergwände“ reicht für beide Stellen.','Bergen und Wand','Berg|wand: Ber-ge beweist das g, Wän-de beweist das d.']]},
abl:{1:[['Wann schreibst du ä statt e?','Wenn es ein verwandtes Wort mit a gibt.','Wenn der Vokal lang ist.','Immer am Wortanfang.','Kälte – kalt: verwandtes Wort mit a, also ä.'],['Wann schreibst du äu statt eu?','Wenn es ein verwandtes Wort mit au gibt.','Wenn das Wort ein Nomen ist.','Wenn ein h folgt.','schäumen – Schaum.'],['Was schreibst du normalerweise, wenn es kein verwandtes Wort mit a oder au gibt?','e oder eu','ä oder äu','Das darf man sich aussuchen.','Normalfall: e und eu, zum Beispiel Ente und heute.']],
3:[['„Käfer“ schreibt man mit ä. Kannst du das ableiten?','Nein. Es gibt kein verwandtes Wort mit a. Es ist ein Merkwort.','Ja, von „Kaffee“.','Ja, von „kaufen“.','Merkwörter wie Käfer, Käfig und Mädchen muss man sich einprägen.'],['Emre schreibt „Heuser“. Wie erklärst du ihm den Fehler?','Häuser kommt von Haus. Wegen au schreibt man äu.','Häuser ist ein Merkwort.','Nach H steht immer äu.','Ableiten: Haus → Häuser.']]},
offen:{1:[['Womit endet eine offene Silbe?','mit einem Vokal, Umlaut oder Doppellaut','mit einem Konsonanten','mit einem h','Offen: ho-ben, Hö-he, Hei-zung.'],['Womit endet eine geschlossene Silbe?','mit einem Konsonanten','mit einem Vokal','mit einem Doppellaut','Geschlossen: Hil-fe, han-deln.'],['Wie heißen au, äu, ei und eu?','Doppellaute (Diphthonge)','Umlaute','Konsonanten','Doppellaute sind zwei Vokalbuchstaben, die zusammen klingen.'],['Wie wird der Vokal in einer offenen Silbe gesprochen?','lang','kurz','gar nicht','Offene Silbe → langer Vokal: Ra-be.'],['Wie wird der Vokal in einer geschlossenen Silbe gesprochen?','kurz','lang','wie ein Umlaut','Geschlossene Silbe → kurzer Vokal: Hil-fe.']]},
ie:{1:[['Die erste Silbe ist geschlossen. Was schreibst du?','immer i','immer ie','ih','Geschlossene erste Silbe → i: Him-mel.'],['Welche Wörter sind Merkwörter mit einfachem i?','mir, dir, wir','Tier, vier, hier','Biene, Wiese, Riese','mir, dir, wir: langes i, aber nur i geschrieben.'],['Welche Wörter schreibt man mit ih?','ihm, ihn, ihr, ihnen','mir, dir, wir','Tiger, Biber, Igel','ih gibt es nur bei ihm, ihn, ihr, ihnen, ihre.'],['Wie prüfst du ein einsilbiges Wort wie „Tier“?','Ich verlängere es: Tie-re.','Ich leite es von einem Wort mit a ab.','Gar nicht.','Die Regel gilt für Zweisilber. Einsilber musst du zuerst verlängern.']],
3:[['Welchen Sonderfall erkennst du in Kantine, Margarine und Apfelsine?','Die Endung -ine schreibt man mit einfachem i, obwohl es lang klingt.','Nach n steht immer ie.','Es sind Wörter mit geschlossener erster Silbe.','-ine: Maschine, Kantine, Margarine, Apfelsine, Gelatine.'],['Warum hilft dir bei „schlief“ die Form „schliefen“?','Sie ist zweisilbig. Die erste Silbe ist offen, also ie.','Weil man dann ein h hört.','Weil man im Präteritum immer ie schreibt.','schlie-fen: offene erste Silbe → ie. Das gilt dann auch für schlief.']]},
h:{1:[['Vor welchen Buchstaben steht das Dehnungs-h oft?','l, m, n, r','b, d, g','s, t, z','Dehnungs-h vor l, m, n, r: Stahl, nehmen, Zahn, Uhr.'],['Wo steht das silbenöffnende h im verlängerten Wort?','am Anfang der zweiten Silbe','am Ende der ersten Silbe','am Wortanfang','Ze-hen, Kü-he: Das h öffnet die zweite Silbe und ist hörbar.'],['Kannst du das Dehnungs-h hören?','Nein, deshalb sind es Merkwörter.','Ja, immer.','Nur beim Flüstern.','Keh-le: Das h am Ende der ersten Silbe hört man nicht.'],['Steht nach jedem langen Vokal ein Dehnungs-h?','Nein, nur manchmal.','Ja, immer.','Nur bei Nomen.','Schule, Tal und Name haben einen langen Vokal, aber kein h.']],
3:[['Warum schreibt man „Stehcafé“ mit h?','Es gehört zum Wortstamm steh (ste-hen). Das h bleibt in verwandten Wörtern erhalten.','Weil nach e immer ein h steht.','Weil das h vor c steht.','Der Wortstamm bleibt gleich: stehen – steht – Stehcafé.'],['Tim schreibt „Schuhle“. Was erklärst du ihm?','Nicht nach jedem langen Vokal steht ein h. Schule schreibt man ohne h.','Er muss „Schuhe“ verlängern.','Das h steht vor l, also ist es richtig.','Das Dehnungs-h steht oft vor l, m, n, r – aber nicht immer.']]},
dopp:{1:[['Wann wird ein Konsonant verdoppelt?','nach einem kurzen Vokal','nach einem langen Vokal','nach einem Doppellaut','Don-ner, Som-mer: kurzer Vokal, geschlossene erste Silbe.'],['Was steht nach einem langen Vokal?','ein einfacher Konsonant','ein doppelter Konsonant','immer ein h','Ne-bel, Re-gen: offene Silbe, langer Vokal, einfacher Konsonant.'],['Kann nach au, ei oder eu ein doppelter Konsonant stehen?','Nein, nie.','Ja, immer.','Nur bei Verben.','Nach Doppellauten steht ein einfacher Konsonant: laufen, Seife.']],
3:[['Sofia schreibt „Somer“. Welcher Tipp hilft ihr?','Schwinge: Som-mer. Die erste Silbe ist geschlossen, der Vokal ist kurz.','Bilde den Plural.','Suche ein verwandtes Wort mit a.','Beim Schwingen hörst du den Konsonanten in beiden Silben: Som-mer.']]},
s:{1:[['Wann schreibst du ss?','nach kurzem Vokal','nach langem Vokal','nach einem Doppellaut','Fluss, Wasser, passen: kurzer Vokal → ss.'],['Wann schreibst du ß?','nach langem Vokal oder Doppellaut, wenn das s scharf klingt','nach kurzem Vokal','am Wortanfang','Fuß, Straße, heiß.'],['Wie klingt das einfache s in „Nase“ oder „lesen“?','weich und summend','scharf und zischend','Man hört es nicht.','Weiches s → einfaches s.']],
3:[['Fluss und Fuß – warum schreibt man sie verschieden?','Bei Fluss ist das u kurz (ss), bei Fuß ist es lang (ß).','Fluss ist länger als Fuß.','Das muss man raten.','Kurzer Vokal → ss, langer Vokal → ß.'],['Warum schreibst du „Haus“ mit s und nicht mit ß?','Verlängern: Häu-ser. Dort klingt das s weich.','Weil nach au immer s steht.','Weil Haus ein Nomen ist.','Am Wortende verlängern: Häuser, Gräser, Mäuse → weiches s.'],['messen – Maß: Warum wechselt der s-Laut?','In „messen“ ist das e kurz (ss), in „Maß“ ist das a lang (ß).','Weil Maß ein Nomen ist.','Das ist ein Druckfehler.','Die Schreibung richtet sich nach der Länge des Vokals davor.']]},
gross:{1:[['Was schreibt man groß?','Nomen, Satzanfänge, Namen und die höfliche Anrede','nur Nomen','alle langen Wörter','Dazu kommt das erste Wort einer Überschrift.'],['Welche Endungen sind typisch für Nomen?','-ung, -heit, -keit, -nis, -schaft, -tum','-ig, -lich, -isch','-en, -st, -t','Zeichnung, Freiheit, Höflichkeit, Geheimnis, Freundschaft, Reichtum.'],['Welche Probe hilft dir, ein Nomen zu erkennen?','die Artikelprobe: der, die oder das davorsetzen','die Verlängerungsprobe','die Ableitungsprobe','der Hund, die Flasche. Auch die Pluralprobe hilft: der Huf – die Hufe.'],['Welche Wörter schreibst du in der höflichen Anrede groß?','Sie, Ihnen, Ihr','du, dir, dein','wir, uns, unser','„Geht es Ihnen gut?“']],
3:[['Du schreibst deiner Lehrerin: „Wie geht es ihnen?“ oder „Wie geht es Ihnen?“','Ihnen groß, weil es die höfliche Anrede ist.','ihnen klein, weil es kein Nomen ist.','Beides ist richtig.','Höfliche Anrede: Sie, Ihnen, Ihr schreibt man groß.']]},
wb:{1:[['Wie sind ä, ö und ü im Wörterbuch einsortiert?','wie a, o und u','ganz am Ende','wie ae, oe und ue','Umlaute werden so sortiert, als hätten sie keine Pünktchen.'],['In welcher Form stehen Verben im Wörterbuch?','im Infinitiv','im Präteritum','in der du-Form','sehen statt sieht.'],['In welcher Form stehen Nomen im Wörterbuch?','im Nominativ Singular','im Plural','mit der Endung -s','Hand statt Hände.'],['Die ersten beiden Buchstaben sind gleich. Wonach wird sortiert?','nach dem dritten Buchstaben','nach dem letzten Buchstaben','nach der Wortlänge','Blatt, Blume, Blüte.']],
3:[['Du suchst „Kaugummipapier“ und findest es nicht. Was tust du?','Ich zerlege es und schlage Kaugummi und Papier getrennt nach.','Ich suche nur unter P wie Papier.','Dann gibt es das Wort nicht.','Zusammengesetzte Wörter musst du zerlegen.'],['Im Wörterbuch steht: „Pizza, die; Plur. -s, auch Pizzen“. Was erfährst du daraus?','den Artikel (die) und die Pluralformen (Pizzas, Pizzen)','nur die Bedeutung','wie man das Wort trennt','Der Eintrag nennt den Artikel und die Pluralformen.']]},
strat:{1:[['Was bedeutet Ableiten?','ein verwandtes Wort suchen, zum Beispiel Räume → Raum','den Plural bilden','in Silben sprechen','Ableiten hilft bei ä/e und äu/eu.'],['Was bedeutet Verlängern?','das Wort länger machen, zum Beispiel Bild → Bilder','das Wort in Teile zerlegen','das Wort auswendig lernen','Dann hörst du den Buchstaben am Wortende.'],['Was machst du mit Merkwörtern?','einprägen, zum Beispiel mit dem inneren Bildschirm','verlängern','ableiten','Merkwörter kann man mit keiner Probe prüfen.'],['Bei welchem Problem hilft dir das Verlängern?','b/p, d/t oder g/k am Wortende','ä oder e','fehlende Silben in langen Wörtern','Hund → Hunde: Du hörst das d.'],['Bei welchem Problem hilft dir das Ableiten?','ä oder e, äu oder eu','d oder t am Wortende','Großschreibung','Bäume → Baum.'],['Wobei hilft dir das Schwingen besonders?','bei langen Wörtern, damit keine Silbe fehlt','bei ä und e','bei der Großschreibung','Scho-ko-la-den-ni-ko-laus.'],['Was machst du zuerst bei „Fahrradhelm“?','in Teile zerlegen: Fahr|rad|helm','steigern','den Infinitiv bilden','Zusammengesetzte Wörter zerlegst du in ihre Teile.']]}};

function solText(t){if(t.type=='c')return t.opts[t.ok];if(t.type=='i')return t.sol;return t.toks.filter(k=>k.bad).map(k=>k.txt.replace(/[.,?!]/g,'')+' → '+k.fix).join(', ')}

/* ---------- Fortschritt (nur in diesem Browser) ---------- */
let P={};
try{P=JSON.parse(localStorage.getItem('rs5')||'{}')||{}}catch(e){P={}}
const save=()=>{try{localStorage.setItem('rs5',JSON.stringify(P))}catch(e){}};
function rec(t,a,ok){P[t]=P[t]||{};const r=P[t][a]=P[t][a]||[];r.push(ok?1:0);if(r.length>12)r.shift();save()}
const arr=(t,a)=>(P[t]&&P[t][a])||[];
function st(r){if(r.length<3)return 0;const q=r.reduce((x,y)=>x+y,0)/r.length;return q>=.8?3:q>=.55?2:1}
const SYM=['○','!','◐','✓'],SL_=['noch offen','noch üben','fast sicher','sicher'];
const lv=(s,l)=>`<i class="lv s${s}" title="${l?l+': ':''}${SL_[s]}">${SYM[s]}</i>`;

/* ---------- Oberfläche ---------- */
const S={view:'home',topic:null,p:null,cur:null,T:null,res:null,tlen:24,tsel:new Set(TOPICS.map(t=>t.k)),reset:false};
const app=document.getElementById('app');
function header(){const tab=S.view=='stand'?'stand':['tsetup','test','tres'].includes(S.view)?'test':'lernen';
  return`<header class="top"><div class="brand">Rechtschreibtrainer<small>Deutsch · Klasse 5</small></div><nav class="tabs">${[['lernen','Lernen'],['test','Test'],['stand','Mein Stand']].map(x=>`<button class="tab ${tab==x[0]?'on':''}" data-a="tab" data-v="${x[0]}">${x[1]}</button>`).join('')}</nav></header>`}
function vHome(){return`<section class="stack"><h1>Was möchtest du üben?</h1><p class="muted">Zu jedem Thema gibt es einen Merkkasten und Aufgaben in drei Stufen. Die Aufgaben werden jedes Mal neu gemischt.</p>
  <div class="legend">Die drei Kästchen zeigen deine Stufen 1, 2, 3: <span>${lv(0)} noch offen</span><span>${lv(1)} noch üben</span><span>${lv(2)} fast sicher</span><span>${lv(3)} sicher</span></div></section>
  <div class="grid">${TOPICS.map(t=>`<button class="card" data-a="topic" data-v="${t.k}"><span class="cn">${t.n}</span><span class="cs">${t.s}</span><span class="lvs">${[1,2,3].map(a=>lv(st(arr(t.k,a)),AFB[a][0])).join('')}</span></button>`).join('')}</div>`}
function vTopic(){const t=TOPICS.find(x=>x.k==S.topic);return`<section class="sheet"><div class="meta"><button class="btn sm ghost" data-a="tab" data-v="lernen">← Alle Themen</button></div><h1>${t.n}</h1>
  <div class="merk"><span class="tag">Merkkasten</span><ul>${t.m.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <h3>Jetzt üben – immer 8 neue Aufgaben</h3><div class="btns">${[1,2,3].map(a=>`<button class="lvbtn" data-a="start" data-v="${a}"><strong>${AFB[a][0]}: ${AFB[a][1]} ${lv(st(arr(t.k,a)))}</strong><span>${AFB[a][2]}</span></button>`).join('')}</div>
  <div class="btns"><button class="btn" data-a="start" data-v="0">Alle Stufen gemischt</button></div></section>`}
function body(t,ans,locked){
  if(t.type=='c')return`<div class="opts">${t.opts.map((o,i)=>{let c='opt';if(locked){if(i==t.ok)c+=' right';else if(i===ans)c+=' wrong'}else if(i===ans)c+=' sel';return`<button class="${c}" data-a="opt" data-v="${i}" ${locked?'disabled':''}>${o}</button>`}).join('')}</div>`;
  if(t.type=='i')return`<div class="inrow"><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Hier schreiben" value="${esc(ans||'')}" ${locked?'disabled':''}><span class="keys">${['ä','ö','ü','ß'].map(k=>`<button class="key" data-a="ins" data-v="${k}" ${locked?'disabled':''}>${k}</button>`).join('')}</span></div>`;
  return`<div class="toks">${t.toks.map((k,i)=>{let c='tok';const on=ans.includes(i);if(locked){if(k.bad)c+=on?' right':' missed';else if(on)c+=' wrong'}else if(on)c+=' sel';return`<button class="${c}" data-a="tok" data-v="${i}" ${locked?'disabled':''}>${esc(k.txt)}</button>`}).join('')}</div>`}
function taskHead(t,i,n,label){return`<div class="meta"><span>${label} · Aufgabe ${i} von ${n}</span><span class="pill">${TN[t.t]} · ${AFB[t.a][0]}</span></div><div class="prog"><i style="width:${Math.round((i-1)/n*100)}%"></i></div><p class="q">${t.q}</p>${t.word?`<div class="word">${t.word}</div>`:''}`}
function vRun(){const c=S.cur,t=c.t,p=S.p;let h=`<section class="sheet">${taskHead(t,p.n,p.total,'Üben')}${body(t,c.ans,c.locked)}`;
  if(c.locked)h+=`<div class="fb ${c.ok?'':'no'}"><strong>${c.ok?pick(['Richtig!','Genau!','Stimmt!','Sehr gut!']):'Noch nicht ganz.'}</strong>${c.ok?'':`<span>Richtig ist: <b>${esc(solText(t))}</b></span>`}<span>${t.why}</span></div><div class="btns"><button class="btn pri" data-a="next">${p.n==p.total?'Zur Auswertung':'Weiter'}</button></div>`;
  else h+=`<div class="btns">${t.type!='c'?'<button class="btn pri" data-a="check">Prüfen</button>':''}<button class="btn sm ghost" data-a="topic" data-v="${p.topic}">Runde beenden</button></div>`;
  return h+'</section>'}
function vPend(){const p=S.p,q=p.right/p.total;return`<section class="sheet"><h1>Runde geschafft</h1><div class="big">${p.right} von ${p.total}</div>
  <p>${q>=.85?'Stark! Das sitzt. Probiere die nächste Stufe oder ein anderes Thema.':q>=.6?'Gut gemacht. Mit einer weiteren Runde wird es noch sicherer.':'Lies den Merkkasten noch einmal und starte dann eine neue Runde. Es kommen andere Aufgaben.'}</p>
  <div class="btns"><button class="btn pri" data-a="start" data-v="${p.afb}">Neue Runde mit neuen Aufgaben</button><button class="btn" data-a="topic" data-v="${p.topic}">Merkkasten und Stufen</button><button class="btn ghost" data-a="tab" data-v="lernen">Alle Themen</button></div></section>`}
function vTsetup(){return`<section class="sheet"><h1>Test wie in der Klassenarbeit</h1><p class="muted">Im Test gibt es Aufgaben aus allen drei Stufen. Du siehst erst am Ende, was richtig war. Danach bekommst du eine Rückmeldung zu jedem Thema.</p>
  <h3>Wie lang soll der Test sein?</h3><div class="chips">${[[12,'Kurz · 12 Aufgaben'],[24,'Normal · 24 Aufgaben'],[36,'Lang · 36 Aufgaben']].map(x=>`<button class="chip ${S.tlen==x[0]?'on':''}" data-a="tlen" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
  <h3>Welche Themen kommen dran?</h3><div class="chips">${TOPICS.map(t=>`<button class="chip ${S.tsel.has(t.k)?'on':''}" data-a="tsel" data-v="${t.k}" aria-pressed="${S.tsel.has(t.k)}">${S.tsel.has(t.k)?'✓ ':''}${t.n}</button>`).join('')}</div>
  <div class="btns"><button class="btn sm ghost" data-a="tall">Alle auswählen</button><button class="btn sm ghost" data-a="tnone">Keine auswählen</button></div>
  <div class="btns"><button class="btn pri" data-a="tstart" ${S.tsel.size?'':'disabled'}>Test starten</button></div></section>`}
function vTest(){const T=S.T,t=T.tasks[T.i];return`<section class="sheet">${taskHead(t,T.i+1,T.tasks.length,'Test')}${body(t,T.ans[T.i],false)}<div class="btns"><button class="btn pri" data-a="tnext">${T.i+1==T.tasks.length?'Test abgeben':'Weiter'}</button><button class="btn sm ghost" data-a="tab" data-v="test">Test abbrechen</button></div></section>`}
const verdict=q=>q>=.8?[3,'Das kannst du gut']:q>=.5?[2,'Fast sicher']:[1,'Noch üben'];
function rowHTML(name,r,n,extra){const q=n?r/n:0,v=verdict(q);return`<div class="row"><span>${name}</span><span class="num">${r}/${n}</span><div class="bar"><i class="b${v[0]}" style="width:${Math.round(q*100)}%"></i></div><span class="verdict v${v[0]}">${SYM[v[0]]} ${v[1]}${extra||''}</span></div>`}
function vTres(){const res=S.res,n=res.length,r=res.filter(x=>x.ok).length,q=r/n;const by=(f)=>{const m={};res.forEach(x=>{const k=f(x);m[k]=m[k]||[0,0];m[k][1]++;if(x.ok)m[k][0]++});return m};
  const A=by(x=>x.t.a),Tm=by(x=>x.t.t);const good=[],mid=[],bad=[];TOPICS.forEach(t=>{const m=Tm[t.k];if(!m)return;const v=verdict(m[0]/m[1])[0];(v==3?good:v==2?mid:bad).push(t)});
  const tips=[];if(A[1]&&A[1][0]/A[1][1]<.7)tips.push('Stufe 1: Lies dir die Merkkästen noch einmal durch. Die Regeln musst du auswendig können.');if(A[2]&&A[2][0]/A[2][1]<.7)tips.push('Stufe 2: Übe die Strategien an vielen Wörtern. Schreibe dein Beweiswort immer auf.');if(A[3]&&A[3][0]/A[3][1]<.7)tips.push('Stufe 3: Übe das Erklären und die Fehlersuche. Sage dir bei jedem Wort laut, warum es so geschrieben wird.');
  const wrong=res.filter(x=>!x.ok);
  return`<section class="sheet"><h1>Deine Rückmeldung</h1><div class="big">${r} von ${n} richtig</div><p>${q>=.85?'Starke Leistung! Du bist gut vorbereitet.':q>=.65?'Schon ordentlich. Schau dir unten an, wo noch Lücken sind.':'Da geht noch mehr. Unten siehst du genau, was du üben solltest.'}</p>
  <h3>Nach Stufen</h3><div class="rows">${[1,2,3].filter(a=>A[a]).map(a=>rowHTML(`${AFB[a][0]}: ${AFB[a][1]}`,A[a][0],A[a][1])).join('')}</div>
  ${tips.length?`<div class="box"><h3>Tipps für dich</h3><ul>${tips.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
  <div class="two"><div class="box"><h3 class="v3">✓ Das kannst du schon gut</h3>${good.length?`<ul>${good.map(t=>`<li>${t.n}</li>`).join('')}</ul>`:'<p class="muted">Hier steht bald etwas. Bleib dran!</p>'}${mid.length?`<h3 class="v2">◐ Fast sicher</h3><ul>${mid.map(t=>`<li>${t.n}</li>`).join('')}</ul>`:''}</div>
  <div class="box"><h3 class="v1">! Das solltest du noch üben</h3>${bad.length?`<ul>${bad.map(t=>`<li>${t.n} <button class="btn sm" data-a="topic" data-v="${t.k}">Üben</button></li>`).join('')}</ul>`:'<p class="muted">Kein Thema mit großen Lücken.</p>'}</div></div>
  <h3>Nach Themen</h3><div class="rows">${TOPICS.filter(t=>Tm[t.k]).map(t=>rowHTML(t.n,Tm[t.k][0],Tm[t.k][1])).join('')}</div>
  ${wrong.length?`<details class="rev" open><summary>Meine Fehler ansehen (${wrong.length})</summary>${wrong.map(x=>`<div class="rv"><span class="muted">${TN[x.t.t]} · ${AFB[x.t.a][0]}</span><span>${x.t.q}</span>${x.t.word?`<span class="w">${x.t.word}</span>`:''}${x.t.type=='p'?`<span class="w">${esc(x.t.toks.map(k=>k.txt).join(' '))}</span>`:''}<span class="v1">Deine Antwort: ${esc(ansText(x.t,x.ans))}</span><span class="v3">Richtig: ${esc(solText(x.t))}</span><span>${x.t.why}</span></div>`).join('')}</details>`:''}
  <div class="btns"><button class="btn pri" data-a="tstart">Neuer Test mit neuen Aufgaben</button><button class="btn" data-a="tab" data-v="lernen">Zum Lernbereich</button></div></section>`}
function vStand(){const all=t=>[1,2,3].flatMap(a=>arr(t,a));const good=[],bad=[],mid=[],open=[];TOPICS.forEach(t=>{const r=all(t.k);if(r.length<5)return open.push(t);const s=st(r);(s==3?good:s==2?mid:bad).push(t)});
  const any=TOPICS.some(t=>all(t.k).length);
  return`<section class="sheet"><h1>Mein Stand</h1><p class="muted">Gezählt werden deine letzten Antworten aus Üben und Test. Der Stand wird nur auf diesem Gerät gespeichert.</p>
  <div class="two"><div class="box"><h3 class="v3">✓ Das kannst du schon gut</h3>${good.length?`<ul>${good.map(t=>`<li>${t.n}</li>`).join('')}</ul>`:'<p class="muted">Noch kein Thema ganz sicher.</p>'}${mid.length?`<h3 class="v2">◐ Fast sicher</h3><ul>${mid.map(t=>`<li>${t.n} <button class="btn sm" data-a="topic" data-v="${t.k}">Üben</button></li>`).join('')}</ul>`:''}</div>
  <div class="box"><h3 class="v1">! Das solltest du noch üben</h3>${bad.length?`<ul>${bad.map(t=>`<li>${t.n} <button class="btn sm" data-a="topic" data-v="${t.k}">Üben</button></li>`).join('')}</ul>`:'<p class="muted">Im Moment nichts.</p>'}${open.length?`<h3 class="v0">○ Noch zu wenig geübt</h3><ul>${open.map(t=>`<li>${t.n} <button class="btn sm ghost" data-a="topic" data-v="${t.k}">Starten</button></li>`).join('')}</ul>`:''}</div></div>
  <h3>Alle Themen und Stufen</h3><div class="rows">${TOPICS.map(t=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><span>${t.n}</span><span class="lvs" style="margin:0">${[1,2,3].map(a=>lv(st(arr(t.k,a)),AFB[a][0])).join('')}</span></div>`).join('')}</div>
  <div class="legend"><span>${lv(0)} noch offen</span><span>${lv(1)} noch üben</span><span>${lv(2)} fast sicher</span><span>${lv(3)} sicher</span></div>
  ${any?`<div class="btns">${S.reset?'<button class="btn" data-a="reset2">Ja, alles löschen</button><button class="btn ghost" data-a="reset0">Abbrechen</button>':'<button class="btn sm ghost" data-a="reset1">Stand zurücksetzen</button>'}</div>`:''}</section>`}
function render(){const v={home:vHome,topic:vTopic,run:vRun,pend:vPend,tsetup:vTsetup,test:vTest,tres:vTres,stand:vStand}[S.view]();app.innerHTML=header()+v;const i=document.getElementById('ans');if(i&&!i.disabled)i.focus()}
function go(v){S.view=v;S.reset=false;render();window.scrollTo(0,0)}
function nextP(){const p=S.p;if(p.n>=p.total)return go('pend');const t=makeTask(p.topic,p.afb||1+R(3));p.n++;S.cur={t,ans:t.type=='p'?[]:null,locked:false};go('run')}
function submitP(ans){const c=S.cur;c.ans=ans;c.ok=grade(c.t,ans);c.locked=true;rec(c.t.t,c.t.a,c.ok);if(c.ok)S.p.right++;render()}
function buildTest(){const ts=[...S.tsel],tasks=[];for(let a=1;a<=3;a++){const o=shuf(ts),part=[];for(let j=0;j<S.tlen/3;j++)part.push(makeTask(o[j%o.length],a));tasks.push(...shuf(part))}S.T={tasks,i:0,ans:tasks.map(t=>t.type=='p'?[]:null)};go('test')}
function act(a,v,el){
  if(a=='tab'){return go(v=='lernen'?'home':v=='test'?'tsetup':'stand')}
  if(a=='topic'){S.topic=v;return go('topic')}
  if(a=='start'){S.p={topic:S.topic,afb:+v,n:0,right:0,total:8};return nextP()}
  if(a=='next')return nextP();
  if(a=='ins'){const i=document.getElementById('ans');i.value+=v;i.focus();return}
  if(a=='tlen'){S.tlen=+v;return render()}
  if(a=='tsel'){S.tsel.has(v)?S.tsel.delete(v):S.tsel.add(v);return render()}
  if(a=='tall'){S.tsel=new Set(TOPICS.map(t=>t.k));return render()}
  if(a=='tnone'){S.tsel=new Set();return render()}
  if(a=='tstart'){if(S.tsel.size)buildTest();return}
  if(a=='reset1'){S.reset=true;return render()}
  if(a=='reset0'){S.reset=false;return render()}
  if(a=='reset2'){P={};save();S.reset=false;return render()}
  if(S.view=='run'){const c=S.cur;if(c.locked)return;
    if(a=='opt')return submitP(+v);
    if(a=='tok'){const i=+v,k=c.ans.indexOf(i);k>=0?c.ans.splice(k,1):c.ans.push(i);el.classList.toggle('sel');return}
    if(a=='check')return submitP(c.t.type=='i'?document.getElementById('ans').value.trim():c.ans)}
  if(S.view=='test'){const T=S.T,t=T.tasks[T.i];
    if(a=='opt'){T.ans[T.i]=+v;return render()}
    if(a=='tok'){const i=+v,r=T.ans[T.i],k=r.indexOf(i);k>=0?r.splice(k,1):r.push(i);el.classList.toggle('sel');return}
    if(a=='tnext'){if(t.type=='i')T.ans[T.i]=document.getElementById('ans').value.trim();T.i++;if(T.i<T.tasks.length)return go('test');
      S.res=T.tasks.map((t,i)=>{const ok=grade(t,T.ans[i]);rec(t.t,t.a,ok);return{t,ans:T.ans[i],ok}});return go('tres')}}
}
if(typeof document!=='undefined'&&app){
  document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.v,b)});
  document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ans'){e.preventDefault();act(S.view=='test'?'tnext':'check')}});
  render();
}
if(typeof module!=='undefined')module.exports={G,TOPICS,grade,solText,makeTask};
</script>
</body>
</html>
